# NiLaM reverse proxy.
#
# Sets the headers that a <meta> element cannot deliver (frame-ancestors, strict
# transport and nosniff), and forwards everything else to the API, which serves
# both the JSON endpoints and the built web application.

server {
    listen 80;
    server_name _;

    # No framing, no MIME sniffing, and mark the app as HTTPS-only once a cert is
    # in front of it.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" always;

    location / {
        proxy_pass http://api:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
